  <style>
    :root {
      --ivory: #f4efe6;
      --paper: #fbf8f3;
      --ink: #2a2622;
      --muted: #6d665e;
      --line: #e2d9cc;
      --chip: #efe8dc;
      --pine: #2f3a32;
      --sage: #6f7d6a;
      --clay: #8c5a3c;
      --warn: #f3e6d4;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.55;
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 80px;
    }
    h1, h2, h3 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 520;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0;
    }
    h1 { font-size: 46px; }
    h2 { font-size: 32px; margin-top: 8px; }
    h3 { font-size: 22px; margin: 22px 0 8px; }
    p { margin: 0 0 14px; }
    .lede { color: var(--muted); font-size: 18px; margin-top: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 28px; }
    .chips.sub { margin: 8px 0 18px; }
    button.chip {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font: 560 15px/1 "Source Sans 3", sans-serif;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    button.chip[aria-pressed="true"] {
      background: var(--pine);
      color: #f6f1e8;
      border-color: var(--pine);
    }
    .stats { display: flex; flex-wrap: wrap; gap: 18px 28px; margin: 8px 0 18px; }
    .stat strong {
      display: block;
      font-family: Fraunces, Georgia, serif;
      font-size: 28px;
      font-weight: 520;
    }
    .stat span { color: var(--muted); font-size: 14px; }
    .note { color: var(--muted); font-size: 14px; }
    a { color: var(--clay); }
    table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 15px; }
    th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
    tbody tr:nth-child(even) { background: rgba(255,255,255,0.45); }
    .wrap { overflow-x: auto; }
    .callout {
      background: var(--paper);
      border-left: 3px solid var(--sage);
      padding: 12px 16px;
      margin: 12px 0 4px;
    }
    .callout.warn { border-left-color: var(--clay); background: var(--warn); }
    .callout strong { display: block; margin-bottom: 4px; }
    .bar { display: grid; grid-template-columns: minmax(140px, 220px) 1fr auto; gap: 10px; align-items: center; margin: 8px 0; font-size: 15px; }
    .track { height: 8px; background: #e7dfd2; border-radius: 99px; }
    .fill { height: 8px; background: var(--sage); border-radius: 99px; }
    .section[hidden] { display: none; }
    footer { margin-top: 36px; color: var(--muted); font-size: 14px; }
    @media (max-width: 640px) {
      h1 { font-size: 34px; }
      .bar { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>

        lesson: "Baker: the house stays clear because the store does the holding. No glass door.",
        shot: "Door open a crack. Oak shelves, closed baskets, warm ivory walls. This is not a hero view.",
        walls: [["Shelf walls", "What the other rooms refuse to hold: festival vessels, luggage, the camera box, spare linen. Axel Vervoordt: the rooms stay quiet because the store is full."]],
        materials: [
          ["Floor", "Builder tile, matt."],
          ["Walls and ceiling", "Warm ivory matt emulsion. One 3000K bulkhead, not a decorative light."],
          ["Shelves", "Light oak, full height. Woven baskets for vessels and linen. No open souvenir display."]
        ]
      }
    ];

    const state = { section: "household", floor: "ground", area: "parents" };

    function esc(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function table(headers, rows) {
      const head = headers.map((cell) => `<th>${esc(cell)}</th>`).join("");
      const body = rows.map((row) => `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join("")}</tr>`).join("");
      return `<div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function chips(items, current, attr) {
      return `<div class="chips${attr === "section" ? "" : " sub"}">${items.map(([id, label]) =>
        `<button class="chip" type="button" data-${attr}="${id}" aria-pressed="${id === current}">${esc(label)}</button>`
      ).join("")}</div>`;
    }

    function household() {
      return `
        <h2>Household</h2>
        <p>He is from Thanedarpally, a village near Nalgonda town, Telangana, and grew up in Yellareddy, Kamareddy district, in a small 1BHK. The house was rural, people hosted each other, and nothing useful was thrown away. The family celebrates Vinayaka Chavithi and Bathukamma. His mother likes a long conversation, and neighbours used to gather at the veranda.</p>
        <p>He is a software engineer, schooled at Jawahar Navodaya Vidyalaya and NIT Warangal. He works from home two or three days a week and needs a real desk, a chair, and light that is fit for a video call. He plays badminton, photographs while travelling, and follows aviation and rockets. He is opinionated, frugal, and prefers simplicity. He likes trees, gardening, and making things last. The same honesty and frugality describe the whole family.</p>
        <p>Four people: his father is 50, his mother is 44, his brother is 20 and lives elsewhere, and he lives here. He plans to marry next year. That conversation with his parents is still in progress. She likes a more lavish room. The house is the mix of the two. A daily help comes in. Nobody lives in. There are no pets, and none are planned. He has no children now, so the front bedroom is an office and the desk is freestanding.</p>
        <p>He wakes at 7–8 am and sleeps by 12:30 am. Energy is high in the morning and drops by about 7 pm. If people are doing something, he joins. Breakfast and dinner are 5 or 6 people, at the kitchen table. His wife or the cook does the cooking. Guests, about 10, come once in a while and usually for dinner. A bar is not a priority. Morning puja is done by his mother or by his wife, one person at a time. Both beds are queens. He has about 20 to 30 outfits. She has more, and both use the master dressing room as a walk-in. He unwinds by sitting outside, keeping plants, cleaning, and reading. Mood is set by dimmed warm light.</p>
        <h3>Where each interest belongs</h3>
        ${table(
          ["What he cares about", "Where it shows up", "What it must not become"],
          [
            ["Photography and handmade pictures", "Three black frames in one row on the solid stretch of the drawing-room window wall", "A gallery wall"],
            ["Travel magnets and souvenirs", "A small shelf in the second-floor lounge, mostly empty", "A fridge covered in magnets"],
            ["Aviation, rockets, Interstellar, Nolan", "One model on the office shelf", "A themed room"],
            ["Morning puja, Bathukamma, Vinayaka Chavithi", "A lamp bright enough at 7 am in the 4'4\" × 4'9\" room. Festival flowers on the drawing shelf.", "A prefabricated temple with LED strings"],
            ["Trees, gardening, outdoors", "Pots on the terrace and the first-floor sit-out", "Built-in soil before a structural load check"],
            ["Reading", "Chair in the master. One chair in the small first-floor lounge.", "A third living room"],
            ["An occasional dinner for about 10", "A table for six that takes one leaf. Drawing seats for after dinner.", "A ten-seat table every day, or a bar"],
            ["Tokyo, then San Francisco", "The calm, light, material feel of the rooms", "A copy of either city"]
          ]
        )}
        <p class="note">Reference: <a href="https://www.instagram.com/p/DbpYqNjkule/">studio riev, Project Reframe</a>, the Basheerbagh renovation. Materials there were marble, granite, veneer, lime plaster, and terrazzo.</p>`;
    }

    function budget() {
      const max = Math.max(...SPEND.map((row) => row[1]));
      const bars = SPEND.map(([name, value]) => `
        <div class="bar">
          <span>${esc(name)}</span>
          <div class="track"><div class="fill" style="width:${(value / max) * 100}%"></div></div>
          <span>₹${value.toFixed(2)} L</span>
        </div>`).join("");
      return `
        <h2>Budget</h2>
        <div class="stats">
          <div class="stat"><strong>₹20–25 L</strong><span>Cap, all inclusive</span></div>
          <div class="stat"><strong>₹${total.toFixed(2)} L</strong><span>This plan</span></div>
          <div class="stat"><strong>Apr 2027</strong><span>Target finish</span></div>
        </div>
        <p>The cap covers furniture, the kitchen, appliances, wardrobes, and lighting. Floors, doors, windows, and bathroom fittings are outside this split, because the builder supplies them. These figures are a planning split for Hyderabad, not quotations.</p>
        ${bars}
        <p class="note">Planning split in ₹ lakh. Cap ₹25 lakh. Source: client budget and the working-drawing scope, November 2026.</p>`;
    }

    function house() {
      return `
        <h2>House details</h2>
        <div class="stats">
          <div class="stat"><strong>180.56 sq yd</strong><span>Plot, east road</span></div>
          <div class="stat"><strong>2,830 sft</strong><span>Brochure total, G+2</span></div>
          <div class="stat"><strong>10 ft</strong><span>Clear height, inferred</span></div>
        </div>
        <p>East road at the front. Rear bedrooms are the quiet rooms. The stair and a glass lift sit in the middle. Clear height is taken as 10 feet because the doors are 8 feet and sliding window SW2, on the second-floor stair, is drawn 8'0" × 10'0". The sheets do not print a floor-to-floor level. Sizes below are from the working drawings, which replace the smaller brochure plan.</p>
        ${table(
          ["Floor", "Room", "Size", "Opening", "Who uses it"],
          [
            ["Ground", "Parents' bedroom, rear", "13'7½\" × 11'6\"", "W2 4'×4'6\", W4 2'×6'6\"", "Father and mother. Dress and a 6'6\" × 8' toilet."],
            ["Ground", "Drawing", "15' × 16'7½\"", "W1 8'×4'6\". Main door 4'×8'", "Guests, neighbours, his mother. Entry from the parking side."],
            ["Ground", "Kitchen and dining", "13'7½\" × 16'", "W5 5'×4'6\", W6 4'×3'", "Weekday family. Cooking and dinner in one room."],
            ["Ground", "Parking", "10'10½\" × 11'9\"", "Open to the east road", "Car. Unpolished granite."],
            ["First", "Master, rear, beside the stair", "16'1½\" × 11'6\"", "W2 4'×4'6\", W4 2'×6'6\"", "The couple. Dress, toilet 8'×6'."],
            ["First", "Office, front, marked C.Bed", "16'6\" × 11'", "W2 4'×4'6\" toward the road", "Work, two or three days a week."],
            ["First", "Sit-out", "8'4½\" × 11'9\"", "Glass door 3'×7'", "The sit-out he asked for. Sheet says an 18\" skirting wall."],
            ["First", "Lounge", "9'4½\" × 12'", "W1 8'×4'6\"", "One reading chair. Too small for a sofa."],
            ["First", "Pooja", "4'4\" × 4'9\"", "Off the lounge", "Daily puja only."],
            ["Second", "Lounge", "15' × 16'7½\"", "Sliding door 7'×7'", "One sofa facing the terrace."],
            ["Second", "Terrace", "24'6\" × 11'", "Glass railing", "Morning sit. Most of the slab stays empty."],
            ["Second", "Home theatre", "19'1½\" × 11'6\"", "Two W4 windows, 2'×6'6\"", "One sofa and a screen. Brother does not live here."],
            ["Second", "Store", "9' × 4'7½\"", "Door 2'9\" × 8'", "Luggage, festival vessels, extra linen."]
          ]
        )}
        <p class="note">Brochure areas: ground 1,085 sft, first 1,085 sft, terrace slab 660 sft, total 2,830 sft. Source: 32'6" × 50' east working plans.</p>
        <h3>Door and window schedule</h3>
        ${table(
          ["Mark", "What it is", "Size"],
          [
            ["MD", "Teak main door, parking into the drawing", "4'0\" × 8'0\""],
            ["D1", "Teak internal door", "3'3\" × 8'0\""],
            ["D2", "Teak internal door", "2'9\" × 8'0\""],
            ["D3", "Teak door, kitchen to the outside", "2'6\" × 8'0\""],
            ["D4", "Teak door, powder room", "2'6\" × 6'0\""],
            ["GD", "UPVC glass door, first-floor sit-out", "3'0\" × 7'0\""],
            ["SD", "UPVC sliding door, second lounge to terrace", "7'0\" × 7'0\""],
            ["W1", "UPVC window, drawing and lounges", "8'0\" × 4'6\""],
            ["W2", "UPVC window, bedrooms", "4'0\" × 4'6\""],
            ["W4", "UPVC window, tall and narrow", "2'0\" × 6'6\""],
            ["W5", "UPVC window, kitchen side", "5'0\" × 4'6\""],
            ["W6", "UPVC window, over the kitchen counter", "4'0\" × 3'0\""],
            ["SW1", "UPVC window", "8'0\" × 5'6\""],
            ["SW2", "UPVC window, second-floor stair", "8'0\" × 10'0\""]
          ]
        )}
        <p class="note">Ventilators: V1 2'0" × 3'0", V2 1'6" × 3'0", V3 1'6" × 1'6", V4 2'6" × 1'6". Windows are UPVC with a mosquito-mesh track.</p>
        <div class="callout"><strong>The sit-out wall</strong>The first-floor sit-out is drawn with an 18-inch skirting wall. That is too low to be the only guard. Ask the builder for the railing above it.</div>`;
    }

    function specs() {
      return `
        <h2>Specifications</h2>
        <p>These are the builder's finishes. Leave them in place. Interior money goes on top of them.</p>
        ${table(
          ["Item", "What the builder provides"],
          [
            ["Structure", "RCC frame, wind and seismic zone II. External walls 9 inches, internal walls 4½ inches."],
            ["Doors", "Teak-engineered frames and shutters, 8 feet high, including the main door. Powder-room door is 6 feet."],
            ["Windows", "UPVC or aluminium sliding windows and French doors, with a mosquito-mesh track."],
            ["Drawing, kitchen, parents, office, lounges", "Large-format vitrified tile. Kajaria, RAK, Johnson, or equivalent."],
            ["Master and home theatre", "Laminated wooden flooring."],
            ["Stair", "Leather-finish granite, steel grey."],
            ["Sit-out and terrace", "Wood-finish vitrified tile."],
            ["Parking", "Unpolished granite."],
            ["Bathrooms", "Anti-skid vitrified tile to sill level. Vanity basin, premium fittings, wet and dry areas. Glass partition in the master bath only."],
            ["Kitchen wall", "Glazed vitrified tile, 2 feet above the platform."],
            ["Paint", "Internal Royal emulsion over two coats of Birla putty. External emulsion on texture."],
            ["Electrical", "Concealed copper wiring, three-phase prepaid meter, full DG backup, split-AC points, two-way fan and light switches in bedrooms."],
            ["Utility points", "Dishwasher and washing machine beside the machine niche at the stair, not on the kitchen platform."],
            ["Other", "Lift provision, intercom, fibre, video door bell, EV charging provision, solar-heater or geyser points in every bath."]
          ]
        )}
        <div class="callout warn"><strong>One point to move before wiring</strong>If the dishwasher is to sit in the kitchen, that utility point has to move before the wiring is closed.</div>`;
    }

    function questions() {
      return `
        <h2>Questions still open</h2>
        <p>These are the answers that would change a drawing. What we already know is in the other chips.</p>
        <h3>Who will actually be here</h3>
        <p>After the wedding, do your parents keep the ground-floor room every night, or do they also travel? Does your brother stay overnight, and for how many nights? Where should an overnight friend sleep, since the front room is the office and the theatre is not a bedroom? Will she move in at possession, in April 2027? Does she work from home, and does she need a corner of the office?</p>
        <h3>A day in the kitchen</h3>
        <p>His wife or the cook cooks. Gas and induction are both in. Five or six eat daily, and about 10 come for dinner once in a while. Still open: what hours is the cook in the house? Is the kitchen vegetarian only? Which appliances are you bringing? Where should wet waste go if you want to compost?</p>
        <h3>Puja and the two festivals</h3>
        <p>Morning puja is done by your mother or your wife. Still open: what has to live on the ledge, idols, photographs, a bell, oil, vessels? For Bathukamma, how large is the arrangement, and is it made in the kitchen or set in the drawing? For Vinayaka Chavithi, is the idol only in the pooja room?</p>
        <h3>Sleep, work, and heat</h3>
        <p>Both beds are queens, with the head to the east. Still open: which side of the bed do you sleep on, and which side is the reading side? Do you need the master dark at 7 am? How many hours are you on video calls, and must the office door close against the lounge? One laptop, or a larger screen? Which rooms need air conditioning from the first summer?</p>
        <h3>Clothes, shoes, and trips</h3>
        <p>You have 20 to 30 outfits. She has more. Both hang in the master walk-in. Still open: how many pairs of shoes, and do they come off only at the main door? Sarees, or mostly other clothes, for your mother? How often are you away with a camera, and does the kit need a shelf in the office or a box in the store? About how many books?</p>
        <h3>Guests and the outdoors</h3>
        <p>About 10 guests come once in a while, usually for dinner. Still open: mornings on the terrace, or on the first-floor sit-out? Do your parents want the sit-out in the evening? Where should clothes dry, the utility yard or a screened corner of the terrace? Ornamental plants only, or herbs and vegetables in pots?</p>
        <h3>The drawing room is decided</h3>
        <p>Swing for two, teak, dark metal chain, empty floor in front of the seat. A 55-inch smart television on the window end of the west wall, soundbar in the teak bench, no set-top box. She may face west. The television stays on when guests come. A fan hangs over the sofa. A stone chandelier hangs over the open floor toward the stair, clear of the swing. The fan point and the chandelier point have to be marked before the ceiling is closed.</p>
        <h3>If the money runs short</h3>
        <p>Rank these if one has to wait: the lime plaster, the kitchen stone, the theatre, the terrace shade, the dress wardrobes. Your parents' own reference images are still to come. Anything in a house you have lived in that you refuse to repeat?</p>`;
    }

    function design() {
      const onFloor = AREAS.filter((item) => item.floor === state.floor);
      const area = onFloor.find((item) => item.id === state.area) || onFloor[0];
      state.area = area.id;
      return `
        <h2>One house, one morning</h2>
        <p>The whole house tells one story: a morning in Thanedarpally, carried into a quiet modern room. The east door and the stair window bring the day in. His parents keep a plain room with an empty floor. The couple keeps lime, oak, and a dim warm light. Science appears once, as one aircraft on the office shelf. Festivals stay in the store and come out into the drawing. A wall tells its story by the material, the light on it, and the one thing it is allowed to hold.</p>
        <p>That is the method of Tadao Ando, Peter Zumthor, Bijoy Jain, Vincent Van Duysen, Axel Vervoordt, and Rose Uniacke, set in the climate of Geoffrey Bawa, B.V. Doshi, Charles Correa, and Laurie Baker, and in the materials of <a href="https://www.instagram.com/p/DbpYqNjkule/">studio riev, Project Reframe</a>. One palette: warm ivory matt paint, lime on the drawing wall opposite the garden window, the master wall behind the bed, the second-floor lounge wall beside the slider, and the pooja. Light beige matt tile, matt oak where the builder already gives wood, sage in the kitchen, honed dark green stone, matte black metal, undyed linen, and 2700K lamps. The office ceiling is 3000K so a face on a call stays true.</p>
        ${chips(FLOORS, state.floor, "floor")}
        ${chips(onFloor.map((item) => [item.id, item.label]), area.id, "area")}
        <h3>${esc(area.label)}</h3>
        <p class="note">${esc(area.size)}</p>
        <p>${esc(area.vastu)}</p>
        <p>${esc(area.lesson)}</p>
        <h3>Every wall</h3>
        ${table(["Wall", "Its story"], area.walls)}
        ${table(["Surface", "What to model"], area.materials)}
        <div class="callout"><strong>The 3D view</strong>${esc(area.shot)}</div>`;
    }

    const renderers = { household, budget, house, specs, design, questions };

    function render() {
      document.getElementById("sections").innerHTML = chips(SECTIONS, state.section, "section");
      document.getElementById("view").innerHTML = renderers[state.section]();
      const hash = state.section === "design"
        ? `#design/${state.floor}/${state.area}`
        : `#${state.section}`;
      if (location.hash !== hash) history.replaceState(null, "", hash);
    }

    function readHash() {
      const parts = location.hash.replace("#", "").split("/");
      if (SECTIONS.some(([id]) => id === parts[0])) state.section = parts[0];
      if (parts[0] === "design") {
        if (FLOORS.some(([id]) => id === parts[1])) state.floor = parts[1];
        if (AREAS.some((item) => item.id === parts[2] && item.floor === state.floor)) state.area = parts[2];
      }
    }

    document.body.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-section], button[data-floor], button[data-area]");
      if (!button) return;
      if (button.dataset.section) state.section = button.dataset.section;
      if (button.dataset.floor) {
        state.floor = button.dataset.floor;
        const first = AREAS.find((item) => item.floor === state.floor);
        state.area = first.id;
      }
      if (button.dataset.area) state.area = button.dataset.area;
      render();
    });

    window.addEventListener("hashchange", () => { readHash(); render(); });
    readHash();
    render();
  </script>
</body>
</html>
